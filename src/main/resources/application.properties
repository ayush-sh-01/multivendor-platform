# Application Name
spring.application.name=multivendor-platform

# Server Port (Automatically binds to cloud $PORT or defaults to 8080 locally)
server.port=${PORT:8080}

# Database Configuration (Supports PostgreSQL/Neon or MySQL from URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/multivendor_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Explicitly set PostgreSQL dialect for Neon DB / cloud environments
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL Logging (Disabled in prod)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
