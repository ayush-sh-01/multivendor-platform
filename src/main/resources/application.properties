# Application Name
spring.application.name=multivendor-platform

# Server Port (Automatically binds to cloud $PORT or defaults to 8080 locally)
server.port=${PORT:8080}

# MySQL Database Configuration (Supports cloud environment variables with local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/multivendor_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ayush7697}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQL Logging (Disabled in prod for performance, can be enabled via env)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
